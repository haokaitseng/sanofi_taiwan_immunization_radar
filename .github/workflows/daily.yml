name: Daily update

on:
  schedule:
    - cron: "53 18 * * *"  # 02:53 Asia/Taipei (UTC+8). Cron is UTC. Off the hour, since GitHub delays scheduled runs most
                           # at the top of the hour; they can still start hours late
  workflow_dispatch:
    inputs:
      backfill:
        description: "Collect the last 90 days (first run only)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the day's data
  pages: write      # deploy the site
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, tag, analyse, build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
        run: python -m pipeline.run daily $BACKFILL

      - name: Commit data (git history is the archive)
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: daily update $(TZ=Asia/Taipei date +%F)"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
